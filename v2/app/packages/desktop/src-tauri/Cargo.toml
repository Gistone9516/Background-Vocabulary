[package]
name = "app"
version = "0.1.0"
description = "배경노트 데스크톱 셸(C4). 커스텀 커맨드 0개 — 권한 판정은 서버만 한다(D-8)."
authors = ["vock"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# C4 S2 로그인 경로. oauth = 루프백 리스너, opener = 시스템 브라우저.
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
# C4 S3 오프라인 캐시(FR-902). 앱 데이터 폴더의 JSON — 서버 응답 사본만 담는다(비밀은 키링).
tauri-plugin-store = "2"
# C4 S4 퀵 캡처(FR-903). Wayland 미지원은 런타임 강등(D-11).
tauri-plugin-global-shortcut = "2"
# OS 자격 증명 저장소(D-5). v3는 저장 백엔드를 feature로 고른다 — Windows/Linux 두 타깃만(D-9).
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
